<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Moedas</title>
</head>
<body>
    <main>
        <label class="converter-de" for="">
            <span>Converter <b>de:</b></span> 
            <select name="" id="">
                <option value="">R$ Real Brasileiro</option>
            </select>
        </label>

        <label class="converter-para" for="">
            <span>Converter <b>para:</b></span>
            <select name="" id="">
                <option value="">US$ Dolár Americano</option>
                <option value="">£ Libra Esterlina</option>
                <option value="">€ Euro</option>
            </select>
        </label>

        <label class="valor" for="" >
            Valor:
            <input type="text" placeholder="R$ 10.000,00">
        </label>

        <button>Converter</button>

        <section class="resultado">
            <div class="resultado-real">
                <img class="bandeira-brasil" src="./assets/brasil.png.png" alt="bandeira-brasil">
                <p>Real</p>
                <p>0,00</p>
            </div>

            <img class="seta" src="./assets/Vector.png" alt="Seta-para-baixo">

            <div class="resultado-dolar">
                <img class="bandeira-usa" src="./assets/usa.png.png" alt="bandeira-estados-unidos">
                <p>Dólar</p>
                <p>0.0</p>
                
            </div>
        </section>
    </main>
    
</body>
</html>
